  answer: 'The timestamps are right and the declared value is wrong: detection is the 09:21 customer-care
    report, not the 09:27 alert, so time to detect is 9 minutes. The alert''s 15-minute latency is recorded
    as a separate fact in the response analysis.'
  answered_by: A. Example (Order Capture product owner)
