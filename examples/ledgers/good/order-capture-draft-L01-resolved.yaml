- id: Q-009
  rule: PIR-CHANNEL-NO-CHAIN
  section: response_analysis
  blocking: true
  question: This channel of inquiry has no Five Whys chain. Starting from the observed fact, why did it
    happen, and why that, until the answer is a process, design or tooling gap?
  status: answered
  answer: 'Chain RC-B (detection) for CH-2: the alert requires 5% for 10 minutes; the window was widened
    from 2 to 10 minutes in May 2026 after false pages; it needed de-tuning because it is on an infrastructure
    symptom rather than the customer outcome; no SLO-based alert on order-submit success exists. Root
    cause: alerting is based on infrastructure symptoms with de-tuned thresholds; there is no burn-rate
    alert on the customer-facing SLO.'
  answered_by: B. Sample (Order Capture SRE champion)
  answered_at: '2026-09-05'
  answer_source: owner interview, 2026-09-05 (facilitated by the Order Capture SRE champion)
  applied_to:
  - /five_whys/1
