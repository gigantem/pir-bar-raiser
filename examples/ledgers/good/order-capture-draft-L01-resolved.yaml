- id: Q-012
  rule: PIR-WHY-DEPTH
  section: five_whys
  blocking: true
  question: This chain stops before it reaches a process cause. Why did the last answer happen?
  status: answered
  answer: 'Three more whys: the two settings are tuned independently and nothing documents or enforces
    the relationship; the change was not load-tested; the change policy classes configuration-only changes
    as low risk and exempts them from load testing and canary. Root cause restated: change policy treats
    capacity-affecting configuration as low risk.'
  answered_by: D. Case (Change Management practice lead)
  answered_at: '2026-09-07'
  answer_source: owner interview, 2026-09-07 (facilitated by the Order Capture SRE champion)
