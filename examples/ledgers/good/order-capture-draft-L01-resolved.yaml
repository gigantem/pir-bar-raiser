- id: Q-011
  rule: PIR-CHAIN-KINDS
  section: five_whys
  blocking: true
  question: No chain follows this line of inquiry. What is the observed fact it starts from, and why did
    it happen?
  status: answered
  answer: 'A third channel of inquiry, CH-3 ''why diagnosis took 44 minutes from first report to confirmed
    cause'', and chain RC-C (resolution): the first 18 minutes went on the Catalogue hypothesis; pool
    saturation is not on the dashboard; the dashboard came from the standard template, which has no saturation
    panels; the template was never reviewed against the four golden signals. Root cause: the standard
    service dashboard template omits saturation signals.'
  answered_by: E. Model (Order Capture team lead)
  answered_at: '2026-09-05'
  answer_source: owner interview, 2026-09-05 (facilitated by the Order Capture SRE champion)
  applied_to:
