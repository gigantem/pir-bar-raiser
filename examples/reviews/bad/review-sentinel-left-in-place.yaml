description: "A scaffold sentinel left in a judgement field is not a judgement."
kind: review
base: examples/reviews/good/order-capture-go-review.json
expect: [REVIEW-SENTINEL]
mutations:
  - {op: replace, path: /summary, value: "ASSESSOR_JUDGEMENT_REQUIRED: the reviewer did not write a summary."}
