description: "A review subject given as an absolute path outside the repository root; it must be refused before it is opened."
kind: review
base: examples/reviews/good/order-capture-go-review.json
expect: [REVIEW-PATH-OUTSIDE]
expect_exactly: true
mutations:
  - {op: replace, path: /subject/path, value: "/etc/hostname"}
