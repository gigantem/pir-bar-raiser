  figures:
    - id: FIG-1
      caption: "POST /orders HTTP 5xx rate, per minute, 3 Sep 2026 08:30 to 11:30 AEST (solid) overlaid with 27 Aug 2026 same window (dotted). Annotations at 09:04 deploy, 09:12 impact start, 09:27 alert, 10:26 rollback complete."
      source: "Grafana dashboard 'Order Capture / Overview', panel 3"
      time_range: "2026-09-03 08:30 to 11:30 AEST"
      baseline_compared: true
      annotated: true
    - id: FIG-2
      caption: "Panel A: database connection pool in-use vs maximum (60), per 10 s, same window; flat at 60 from 09:11 to 10:25. Panel B: Catalogue service p99 latency, same window, within normal band throughout."
      source: "ad-hoc Prometheus query saved as PIR-0412-pool; Catalogue dashboard panel 7"
      time_range: "2026-09-03 08:30 to 11:30 AEST"
      baseline_compared: true
      annotated: true
  summary:
    - metric: "POST /orders 5xx rate (per minute)"
      meaning: Customer-facing failure
      normal_baseline: "0.2%"
      during_incident: "Peak 11%"
      source: FIG-1
    - metric: "Order submissions succeeded (per minute)"
      meaning: Business outcome
      normal_baseline: "540 plus or minus 60 at this hour"
      during_incident: "470 to 490, with 60 to 70 failures per minute"
      source: "business metrics warehouse, query saved as PIR-0412-orders"
    - metric: "DB connection pool in-use (of 60)"
      meaning: Diagnostic saturation signal
      normal_baseline: "18 to 25"
      during_incident: "60 (saturated) from 09:11 to 10:25"
