  time_to_remediate_minutes: 21
  customer_impact_minutes: 74
  time_to_resolve_minutes: 95
summary: >-
  Order Capture API experienced an 11% HTTP 5xx error rate on order submissions from 09:12 to
  10:26 AEST on 3 September 2026. Change CHG-88213, deployed at 09:04, raised the service's
  downstream concurrency limit from 50 to 200 without raising the database connection pool
  (fixed at 60), and the pool was exhausted under normal Wednesday-morning load. Customer care reported failures at 09:21, an alert
  fired at 09:27, pool exhaustion was confirmed as the cause at 10:05, and a rollback restored normal
  error rates at 10:26. Approximately 4,200 order submissions from around 3,100 customers failed
  during the window and 612 queued orders were delivered up to 40 minutes late. No orders were
  lost or duplicated. The rollback is a permanent fix for this change; the underlying gaps are
  addressed by CA-1 to CA-4.
timeline:
  - at: "2026-09-03T09:04:00+10:00"
    event: "CHG-88213 (config v2.14.0) deployed to Order Capture API production: downstream concurrency 50 to 200."
    evidence: deploy log
    phase: precursor
  - at: "2026-09-03T09:12:00+10:00"
    event: "5xx rate on POST /orders rises from 0.2% to 8%, climbing to 11% by 09:20."
    evidence: FIG-1
    phase: impact_start
  - at: "2026-09-03T09:21:00+10:00"
    event: "Customer care reports 'order submit fails' in the support channel (first human signal; no alert yet)."
    evidence: ticket CS-55120
    phase: detection
  - at: "2026-09-03T09:27:00+10:00"
    event: "Alert 'OrderCapture 5xx > 5% for 10 min' pages the on-call engineer."
    evidence: alert A-2231
    phase: detection
  - at: "2026-09-03T09:31:00+10:00"
    event: "Sev-1 declared; Incident Manager engaged; war room opened."
    evidence: decision log
    phase: response
  - at: "2026-09-03T09:45:00+10:00"
    event: "Hypothesis 1 'Catalogue service degraded' rejected: catalogue p99 latency normal for the whole window."
    evidence: FIG-2 panel B
    phase: diagnosis
  - at: "2026-09-03T10:05:00+10:00"
    event: "Hypothesis 2 'DB pool exhausted after config change' proven: pool in-use at 60/60 from 09:11; timing matches CHG-88213."
    evidence: ad-hoc query, FIG-2 panel A
    phase: diagnosis
  - at: "2026-09-03T10:14:00+10:00"
    event: "Incident Manager decision: roll back to v2.13.4 rather than raise pool size, as the pool limit is untested above 60."
    evidence: decision log
    phase: remediation
  - at: "2026-09-03T10:26:00+10:00"
    event: "Rollback complete; 5xx rate below 1%."
    evidence: FIG-1
    phase: mitigated
  - at: "2026-09-03T10:47:00+10:00"
    event: "Queued orders (612) delivered; error rate at baseline; Sev-1 resolved."
    evidence: order queue depth panel
    phase: resolved
  - at: "2026-09-03T11:10:00+10:00"
    event: "Final executive and customer-care update sent."
    evidence: comms record
    phase: comms
