id: PIR-2026-0412
status: in_go_review
document_control:
  incident_id: INC-2026-0412
  title: "Order Capture API: 11% of order submissions failed after a configuration change exhausted the database connection pool"
  severity: Sev-1
  services:
    - Order Capture API
    - Order Queue
  timestamps:
    impact_start: "2026-09-03T09:12:00+10:00"
    detected_at: "2026-09-03T09:21:00+10:00"
    cause_confirmed_at: "2026-09-03T10:05:00+10:00"
    mitigated_at: "2026-09-03T10:26:00+10:00"
    resolved_at: "2026-09-03T10:47:00+10:00"
  pir_owner: Order Capture product owner (A. Example)
  incident_manager: Major Incident Manager, Service Operations
  contributors:
    - Order Capture engineering team
