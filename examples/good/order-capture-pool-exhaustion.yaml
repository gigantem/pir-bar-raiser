customer_impact:
  who: "Consumer and small-business customers submitting orders through the web and app channels in all regions."
  experienced: "'Something went wrong, please try again' on submit; retries also failed in most cases while the pool was exhausted."
  how_many: "4,180 failed submissions from 3,090 distinct customer IDs between 09:12 and 10:26, about 11% of submissions in the window."
  how_counted: "Log query PIR-0412-failed over the gateway access logs, de-duplicated by customer ID."
  duration: "74 minutes of failed submissions (09:12 to 10:26), plus 21 minutes of delayed delivery for queued orders (to 10:47)."
  business_metrics: "An estimated 1,900 orders were not re-attempted by 17:00 compared with the normal re-attempt rate, roughly $86k of order value at risk; 612 orders delivered 20 to 40 minutes late; support contacts 3.4 times the hourly norm between 09:30 and 11:00."
  commitments: "Monthly order-submit availability SLO (99.9%) consumed 58% of its error budget in one event. No contractual SLA breached."
  contacted: "Two enterprise partners contacted by the account team at 11:30 on 3 Sep; both confirmed impact matched our estimate."
  not_affected: "Retail-store channel (separate order path); order status lookups; payments."
  data_integrity: "No orders lost or duplicated, verified by reconciling the order queue against the orders table at 11:05."
response_analysis:
  went_well:
    - "Once pool exhaustion was confirmed, the decision to roll back rather than tune was made in 9 minutes and executed in 12, because the rollback runbook was current and had been rehearsed in August."
    - "Customer care escalated the first reports to the on-call channel within 6 minutes of noticing them."
  missed:
    - area: detection
      gap: "The only alert on this path requires 5% errors sustained for 10 minutes, so it fired 15 minutes after impact start and 6 minutes after customer care had already noticed."
      effect: "The first 9 minutes of the 74-minute impact window had no signal at all, and the next 6 relied on customer care rather than monitoring."
    - area: diagnosis
      gap: "Pool saturation is not on the service dashboard; it was found by an ad-hoc query after the first hypothesis was rejected."
      effect: "Around 25 of the 44 minutes of time to know."
    - area: remediation
      gap: "Rollback required a manual decision and a manual pipeline trigger; no automated rollback exists for this service."
      effect: "About 12 of the 21 minutes of time to remediate were mechanical steps a deploy guard could have taken."
    - area: prevention
      gap: "CHG-88213 was classed as 'config only, low risk' and so required neither a load test nor a canary stage."
      effect: "The interaction between concurrency and pool size was never exercised before production."
  channels_of_inquiry:
    - id: CH-1
      statement: "Why the configuration change exhausted the connection pool."
    - id: CH-2
      statement: "Why the alert took 15 minutes and arrived after a customer-care report."
    - id: CH-3
      statement: "Why diagnosis took 44 minutes from first report to confirmed cause."
five_whys:
  - id: RC-A
    kind: failure
    channel: CH-1
    problem_statement: "POST /orders returned 5xx for 11% of requests from 09:12."
    whys:
      - why: "Why did requests fail?"
        because: "Requests timed out waiting for a database connection; pool in-use was 60 of 60 from 09:11."
        evidence: FIG-2 panel A
      - why: "Why was the pool exhausted?"
        because: "CHG-88213 raised downstream concurrency from 50 to 200, so up to 200 in-flight requests competed for 60 connections."
        evidence: CHG-88213 diff; deploy log
      - why: "Why could concurrency be raised without the pool?"
        because: "The two settings are tuned independently; nothing documents or enforces that pool size must scale with concurrency."
        evidence: service configuration reference, no cross-reference between the two keys
      - why: "Why was the interaction not caught before production?"
        because: "The change was not load-tested, so the interaction was never exercised."
        evidence: CHG-88213 record shows no load-test stage
      - why: "Why was it not load-tested?"
        because: "Our change policy classes configuration-only changes as low risk and exempts them from pre-production load testing and canary release."
        evidence: change policy section 4.2
    root_cause: "Change policy treats capacity-affecting configuration as low risk, so such changes reach production without load testing or a canary."
  - id: RC-B
    kind: detection
    channel: CH-2
    problem_statement: "The first alert fired 15 minutes after impact start, after a customer-care report."
    whys:
      - why: "Why did the alert take 15 minutes?"
        because: "The alert requires 5% errors sustained for 10 minutes."
        evidence: alert A-2231 definition
      - why: "Why is the window 10 minutes?"
        because: "It was widened from 2 to 10 minutes in May 2026 after false pages during a batch job."
        evidence: alert change history, May 2026
      - why: "Why did it need de-tuning?"
        because: "The alert is on an infrastructure symptom (5xx) rather than the customer outcome (order submissions succeeding), so it has to be de-tuned to avoid noise."
        evidence: alerting review notes
      - why: "Why is there no customer-outcome alert?"
        because: "No SLO-based alert on order-submit success exists; the service has an SLO but it is reported monthly, not alerted on."
        evidence: SLO register entry for Order Capture
    root_cause: "Alerting is based on infrastructure symptoms with de-tuned thresholds; there is no burn-rate alert on the customer-facing SLO."
  - id: RC-C
    kind: resolution
    channel: CH-3
    problem_statement: "It took 44 minutes from the first report to confirmed cause, 38 of them after the alert."
    whys:
      - why: "Why did diagnosis take 44 minutes?"
        because: "The first 18 minutes were spent on the Catalogue hypothesis, and pool saturation was only found by an ad-hoc query afterwards."
        evidence: decision log 09:31 to 10:05
      - why: "Why was pool saturation not seen sooner?"
        because: "Pool saturation is not on the service's dashboard, so responders did not see it."
        evidence: "dashboard 'Order Capture / Overview' panel list"
      - why: "Why is it not on the dashboard?"
        because: "The dashboard was generated from the standard service template, which has latency, errors and traffic panels but no saturation panels."
        evidence: dashboard template v3 definition
      - why: "Why does the template omit saturation?"
        because: "The template was never reviewed against the four golden signals guidance when it was adopted."
        evidence: template adoption record, no review noted
    root_cause: "The standard service dashboard template omits saturation signals, so responders lack the diagnostic metric for a whole class of failures."
lessons:
  - id: LL-1
    statement: "We treated a change that quadrupled concurrency as low risk because it did not touch code. Capacity parameters are as risky as code and we should test and canary them the same way."
    root_cause: RC-A
  - id: LL-2
    statement: "We found out from customer care, not from monitoring. We alert on what the infrastructure does, not on whether customers can place orders, and we have de-tuned those alerts to the point that they lag real impact by a quarter of an hour."
    root_cause: RC-B
  - id: LL-3
    statement: "We spent 25 minutes looking for a metric that should have been on the first screen a responder opens. Our dashboard template does not show saturation, and we never checked it against our own guidance."
    root_cause: RC-C
corrective_actions:
  - id: CA-1
    statement: "Reclassify capacity-affecting configuration changes as performance-impacting so they require a load test and a canary stage."
    addresses: [LL-1]
    improves: [prevention]
  - id: CA-2
    statement: "Alert on the order-submit success SLO using multi-window burn rate, so a real 11% failure pages within 2 minutes without adding noise."
    addresses: [LL-2]
    improves: [ttd]
  - id: CA-3
    statement: "Add saturation panels (connection pools, thread pools, queue depth) to the standard dashboard template and roll out to all services that use it."
    addresses: [LL-3]
    improves: [ttk]
  - id: CA-4
    statement: "Automatic rollback of a deployment when SLO burn rate crosses the fast-burn threshold within 30 minutes of the deploy."
    addresses: [LL-1]
    improves: [ttr]
action_items:
  - id: AI-1
    statement: "Amend the change-risk classification in the change policy so that any change to concurrency, pool, queue or rate-limit parameters is classed performance-impacting."
    corrective_action: CA-1
    owner: Change Management practice lead
    owner_agreed: true
    due_date: "2026-10-10"
    status: open
    prevents_recurrence: "Routes capacity changes to load test and canary, so the untested interaction cannot reach production unexercised."
  - id: AI-2
    statement: "Add a load-test stage to the Order Capture API pipeline that runs the standard Wednesday-morning traffic profile against any performance-impacting change."
    corrective_action: CA-1
    owner: Order Capture team lead
    owner_agreed: true
    due_date: "2026-10-24"
    status: open
    prevents_recurrence: "Exercises concurrency and pool settings together under representative load before release."
  - id: AI-3
    statement: "Implement a multi-window burn-rate alert (1 h / 5 min fast burn, 6 h / 30 min slow burn) on the order-submit success SLO, paging the Order Capture on-call."
    corrective_action: CA-2
    owner: Order Capture SRE champion
    owner_agreed: true
    due_date: "2026-10-03"
    status: in_progress
    prevents_recurrence: "Halves time to detect: an 11% failure pages within about 2 minutes instead of 15."
  - id: AI-4
    statement: "Retire the '5xx > 5% for 10 min' alert once AI-3 has run for two weeks without false pages."
    corrective_action: CA-2
    owner: Order Capture SRE champion
    owner_agreed: true
    due_date: "2026-10-17"
    status: open
    prevents_recurrence: "Removes the de-tuned symptom alert so responders are not paged twice for one event and the SLO alert is the one that is maintained."
  - id: AI-5
    statement: "Add saturation panels (DB pool in-use vs max, HTTP client pool, worker queue depth) to the standard service dashboard template."
    corrective_action: CA-3
    owner: Observability COE
    owner_agreed: true
    due_date: "2026-10-17"
    status: open
    prevents_recurrence: "Halves time to know for pool and queue exhaustion across every service built from the template."
  - id: AI-6
    statement: "Regenerate dashboards for the 14 services using the template and confirm each one shows its pools."
    corrective_action: CA-3
    owner: Observability COE with each service team
    owner_agreed: true
    due_date: "2026-11-07"
    status: open
    prevents_recurrence: "Makes the diagnostic metric visible where responders look, for the other 13 services as well as this one."
  - id: AI-7
    statement: "Enable deploy-guard auto-rollback for Order Capture API, triggered by the AI-3 fast-burn alert within 30 minutes of a deploy."
    corrective_action: CA-4
    owner: Order Capture team lead
    owner_agreed: true
    due_date: "2026-11-14"
    status: open
    prevents_recurrence: "Halves time to remediate for deployment-caused incidents by removing the human decision loop."
review:
  stages:
    - stage: team
