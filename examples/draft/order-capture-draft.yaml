  time_to_know_minutes: 44
  time_to_remediate_minutes: 21
  customer_impact_minutes: 74
  time_to_resolve_minutes: 95
summary: >-
  Customers could not place orders for a while after a configuration change went out. The
  change was rolled back and the service recovered. The underlying problem was the database
  connection pool, which was too small for the new concurrency setting, and the team will look
  at alerting and dashboards as well as the change process so that this cannot happen again.
timeline:
  - at: "2026-09-03T09:04:00+10:00"
    event: "CHG-88213 (config v2.14.0) deployed to Order Capture API production: downstream concurrency 50 to 200."
    evidence: deploy log
    phase: precursor
  - at: "2026-09-03T09:12:00+10:00"
    event: "5xx rate on POST /orders rises from 0.2% to 8%."
    evidence: FIG-1
    phase: impact_start
  - at: "2026-09-03T09:21:00+10:00"
    event: "Customer care reports 'order submit fails' in the support channel."
    evidence: ticket CS-55120
    phase: detection
  - at: "2026-09-03T09:27:00+10:00"
    event: "Alert 'OrderCapture 5xx > 5% for 10 min' pages the on-call engineer."
    evidence: alert A-2231
    phase: detection
  - at: "2026-09-03T09:31:00+10:00"
    event: "Sev-1 declared; Incident Manager engaged; war room opened."
    evidence: decision log
    phase: response
  - at: "2026-09-03T10:14:00+10:00"
    event: "Incident Manager decision: roll back to v2.13.4."
    evidence: decision log
    phase: remediation
  - at: "2026-09-03T10:26:00+10:00"
    event: "Rollback complete; 5xx rate below 1%."
    evidence: FIG-1
    phase: mitigated
  - at: "2026-09-03T10:47:00+10:00"
    event: "Queued orders delivered; Sev-1 resolved."
    evidence: order queue depth panel
    phase: resolved
metrics:
  figures:
    - id: FIG-1
      caption: "POST /orders HTTP 5xx rate, 3 Sep 2026 09:00 to 11:00 AEST."
      source: "Grafana dashboard 'Order Capture / Overview', panel 3"
      time_range: "2026-09-03 09:00 to 11:00 AEST"
      baseline_compared: false
      annotated: false
  summary:
    - metric: "POST /orders 5xx rate"
      meaning: Customer-facing failure
      normal_baseline: "0.2%"
      during_incident: "Average 6% over the hour"
      source: FIG-1
customer_impact:
  who: "Customers submitting orders through the web and app channels."
  experienced: "'Something went wrong, please try again' on submit."
  how_many: "Some customers; the exact number is still being worked out."
  how_counted: "Not yet counted."
  duration: "74 minutes of failed submissions (09:12 to 10:26)."
  business_metrics: "Not yet assessed."
  commitments: "Monthly order-submit availability SLO (99.9%)."
  contacted: "Not yet."
  not_affected: "Retail-store channel (separate order path); order status lookups; payments."
  data_integrity: "No orders lost or duplicated, verified by reconciling the order queue against the orders table at 11:05."
response_analysis:
  went_well:
    - "Once pool exhaustion was confirmed, the decision to roll back was made in 9 minutes and executed in 12."
  missed:
    - area: detection
      gap: "The only alert on this path requires 5% errors sustained for 10 minutes, so it fired 15 minutes after impact start and 6 minutes after customer care had already noticed."
      effect: "The first 9 minutes of the 74-minute impact window had no signal at all, and the next 6 relied on customer care rather than monitoring."
  channels_of_inquiry:
    - id: CH-1
      statement: "Why the configuration change exhausted the connection pool."
    - id: CH-2
      statement: "Why the alert took 15 minutes and arrived after a customer-care report."
five_whys:
  - id: RC-A
    kind: failure
    channel: CH-1
    problem_statement: "POST /orders returned 5xx for 11% of requests from 09:12."
    whys:
      - why: "Why did requests fail?"
        because: "Requests timed out waiting for a database connection; pool in-use was 60 of 60 from 09:11."
        evidence: FIG-2 panel A
      - why: "Why was the pool exhausted?"
        because: "CHG-88213 raised downstream concurrency from 50 to 200, so up to 200 in-flight requests competed for 60 connections."
        evidence: CHG-88213 diff; deploy log
    root_cause: "The concurrency setting was raised without raising the connection pool."
lessons:
  - id: LL-1
    statement: "We treated a change that quadrupled concurrency as low risk because it did not touch code. Capacity parameters are as risky as code and we should test and canary them the same way."
    root_cause: RC-A
corrective_actions:
  - id: CA-1
    statement: "Reclassify capacity-affecting configuration changes as performance-impacting so they require a load test and a canary stage."
    addresses: [LL-1]
    improves: [prevention]
action_items:
  - id: AI-1
    statement: "Investigate the change policy for configuration changes."
    corrective_action: CA-1
    owner: TBD
    owner_agreed: false
    due_date: "2026-10-10"
    status: open
    prevents_recurrence: "To be confirmed once the policy change is scoped."
