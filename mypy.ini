# The type check the gate runs over tools/. PyYAML and jsonschema
# are typed through their stub packages in requirements-dev.txt; python-docx ships its own types.
# No module is exempted, and an ignore that suppresses nothing is itself an error.
[mypy]
python_version = 3.12
files = tools
warn_unused_ignores = True
warn_redundant_casts = True
